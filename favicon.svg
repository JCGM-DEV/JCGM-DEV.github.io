<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#140a33"/>
      <stop offset="60%" stop-color="#080417"/>
      <stop offset="100%" stop-color="#03010d"/>
    </radialGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70FFFF"/>
      <stop offset="50%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>

    <!-- Magenta Slash Gradient -->
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3399"/>
      <stop offset="50%" stop-color="#FF006E"/>
      <stop offset="100%" stop-color="#BF00FF"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#BF00FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF006E" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter for Crisp Render -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge with Squircle Shape -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#bgGlow)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.85"/>

  <!-- Subtle Cyber Tech Corner Accents -->
  <path d="M 18 32 L 18 20 L 30 20" fill="none" stroke="#00F5FF" stroke-width="2" opacity="0.6"/>
  <path d="M 110 96 L 110 108 L 98 108" fill="none" stroke="#FF006E" stroke-width="2" opacity="0.6"/>

  <!-- Code Glyphs: < / > with Neon Glow -->
  <g filter="url(#neonGlow)">
    <!-- Opening Bracket < -->
    <path d="M 44 42 L 24 64 L 44 86" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic Forward Slash / -->
    <path d="M 72 32 L 56 96" 
          fill="none" 
          stroke="url(#magentaGrad)" 
          stroke-width="10.5" 
          stroke-linecap="round"/>

    <!-- Closing Bracket > -->
    <path d="M 84 42 L 104 64 L 84 86" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
